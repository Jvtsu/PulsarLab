name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.11"

    runs-on: ${{ matrix.os }}

    env:
      QT_QPA_PLATFORM: offscreen

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip


      # Dependencias gráficas necesarias para PySide6 en Ubuntu
      - name: Install Qt runtime libraries (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libfontconfig1


      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      - name: Install package
        run: |
          python -m pip install -e .


      - name: Install test dependencies
        run: |
          python -m pip install "pytest>=8"


      # Verifica que Qt pueda iniciar correctamente
      - name: Verify PySide6 installation
        run: |
          python -c "from PySide6.QtWidgets import QApplication; print('PySide6 OK')"


      - name: Run tests
        run: |
          python -m pytest -q


      # Verificación final del comando instalado
      - name: Self-check
        run: |
          plab --selfcheck