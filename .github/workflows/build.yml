name: Build PulsarLab

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python for project metadata
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Resolve and validate version
        id: get_version
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          VERSION="$PROJECT_VERSION"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            if [[ "$TAG_VERSION" != "$PROJECT_VERSION" ]]; then
              echo "Tag version ($TAG_VERSION) does not match pyproject.toml ($PROJECT_VERSION)." >&2
              exit 1
            fi
          fi
          echo "Building version $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            architecture: x64
            spec: packaging/windows/PulsarLab-folder.spec
            artifact_name: PulsarLab-Windows
          - os: ubuntu-22.04
            platform: linux
            architecture: x64
            spec: packaging/linux/PulsarLab.spec
            artifact_name: PulsarLab-Linux
          - os: macos-26
            platform: macos
            architecture: arm64
            spec: packaging/macos/PulsarLab.spec
            artifact_name: PulsarLab-macOS-arm64
          - os: macos-26-intel
            platform: macos
            architecture: x86_64
            spec: packaging/macos/PulsarLab.spec
            artifact_name: PulsarLab-macOS-x86_64

    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify build architecture
        shell: bash
        run: |
          ACTUAL_ARCH="$(python -c 'import platform; print(platform.machine())')"
          echo "Python architecture: $ACTUAL_ARCH (expected: ${{ matrix.architecture }})"
          if [[ "${{ matrix.platform }}" == "macos" && "$ACTUAL_ARCH" != "${{ matrix.architecture }}" ]]; then
            echo "Runner architecture mismatch." >&2
            exit 1
          fi
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install "pyinstaller>=6.10,<7"
      - name: Build with PyInstaller
        shell: bash
        run: pyinstaller --noconfirm --clean "${{ matrix.spec }}"
      - name: Smoke-test frozen executable (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            EXE="dist/PulsarLab.app/Contents/MacOS/PulsarLab"
            codesign --verify --deep --strict "dist/PulsarLab.app"
          else
            EXE="dist/PulsarLab/PulsarLab"
          fi
          "$EXE" --selfcheck
          "$EXE" --smoke-test
      - name: Smoke-test frozen executable (Windows)
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          foreach ($arg in @('--selfcheck', '--smoke-test')) {
            $proc = Start-Process -FilePath "dist\PulsarLab\PulsarLab.exe" `
              -ArgumentList $arg -NoNewWindow -Wait -PassThru
            if ($proc.ExitCode -ne 0) {
              throw "PulsarLab.exe failed $arg (exit code $($proc.ExitCode))."
            }
          }
      - name: Build and smoke-test Windows portable executable
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean packaging\windows\PulsarLab-portable.spec
          foreach ($arg in @('--selfcheck', '--smoke-test')) {
            $proc = Start-Process -FilePath "dist\PulsarLab-Portable.exe" `
              -ArgumentList $arg -NoNewWindow -Wait -PassThru
            if ($proc.ExitCode -ne 0) {
              throw "PulsarLab-Portable.exe failed $arg (exit code $($proc.ExitCode))."
            }
          }
      - name: Install Inno Setup
        if: matrix.platform == 'windows'
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ env.APP_VERSION }}" `
            packaging\windows\PulsarLab.iss
      - name: Upload build artifact (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/PulsarLab/**
            dist/PulsarLab-Portable.exe
            dist/installer/**
          if-no-files-found: error
      - name: Upload build artifact (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/PulsarLab/**
          if-no-files-found: error
      - name: Package macOS application bundle
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/PulsarLab.app \
            "dist/PulsarLab-${APP_VERSION}-macOS-${{ matrix.architecture }}.zip"
      - name: Upload build artifact (macOS)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/PulsarLab-${{ env.APP_VERSION }}-macOS-${{ matrix.architecture }}.zip
          if-no-files-found: error

  release:
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          cp release-artifacts/PulsarLab-Windows/installer/*.exe release-assets/
          cp release-artifacts/PulsarLab-Windows/PulsarLab-Portable.exe release-assets/
          (cd release-artifacts/PulsarLab-Windows && zip -r -X \
            "../../release-assets/PulsarLab-${APP_VERSION}-Windows-x64.zip" PulsarLab)

          (cd release-artifacts/PulsarLab-Linux && zip -r -X \
            "../../release-assets/PulsarLab-${APP_VERSION}-Linux-x64.zip" .)

          # ditto creates a macOS-native archive that preserves .app bundle metadata and symlinks.
          cp release-artifacts/PulsarLab-macOS-arm64/*.zip release-assets/
          cp release-artifacts/PulsarLab-macOS-x86_64/*.zip release-assets/

          git archive --format=zip --prefix=PulsarLab/ \
            -o "release-assets/PulsarLab-${APP_VERSION}-Source.zip" HEAD
          ls -lah release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PulsarLab ${{ env.APP_VERSION }}
          generate_release_notes: true
          files: release-assets/*
