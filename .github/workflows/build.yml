name: Build PulsarLab

# ======================================================
# Pipeline multiplataforma de compilación
#
# Genera, para cada sistema operativo:
#   - Windows: carpeta PyInstaller (--onedir) + instalador Inno Setup (.exe)
#   - Linux:   carpeta PyInstaller (--onedir)
#   - macOS:   carpeta PyInstaller (--onedir) + paquete .app
#
# En tags "v*" además publica un GitHub Release con los tres artefactos
# y un ZIP de código fuente con el nombre de carpeta correcto.
# ======================================================

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ----------------------------------------------------
  # Calcula una única versión para todos los jobs, para que el
  # instalador de Windows y el ZIP del release usen exactamente
  # el mismo número.
  # ----------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Extract version
        id: get_version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "Building version $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            spec: packaging/windows/PulsarLab-folder.spec
            artifact_name: PulsarLab-Windows

          - os: ubuntu-latest
            platform: linux
            spec: packaging/linux/PulsarLab.spec
            artifact_name: PulsarLab-Linux

          - os: macos-latest
            platform: macos
            spec: packaging/macos/PulsarLab.spec
            artifact_name: PulsarLab-macOS

    runs-on: ${{ matrix.os }}

    env:
      APP_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install "pyinstaller>=6.10,<7"

      - name: Build with PyInstaller
        shell: bash
        run: pyinstaller --noconfirm --clean "${{ matrix.spec }}"

      - name: Smoke-test the frozen executable (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            EXE="dist/PulsarLab.app/Contents/MacOS/PulsarLab"
          else
            EXE="dist/PulsarLab/PulsarLab"
          fi
          "$EXE" --selfcheck

      - name: Smoke-test the frozen executable (Windows)
        if: matrix.platform == 'windows'
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Se usa Start-Process -Wait -PassThru en vez de "&" + $LASTEXITCODE:
          # PulsarLab.exe es un ejecutable "console=False" (subsistema Windows,
          # sin consola propia). Con "&", $LASTEXITCODE puede leerse antes de
          # que el proceso termine de asentarse del todo bajo PowerShell 5.1,
          # dando un falso negativo aunque el self-check haya terminado bien.
          # Start-Process -PassThru da un objeto de proceso con ExitCode fiable.
          $proc = Start-Process -FilePath "dist\PulsarLab\PulsarLab.exe" `
            -ArgumentList "--selfcheck" -NoNewWindow -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "El ejecutable se creó, pero falló su prueba de apertura (exit code $($proc.ExitCode))."
          }

      - name: Install Inno Setup
        if: matrix.platform == 'windows'
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ env.APP_VERSION }}" `
            packaging\windows\PulsarLab.iss

      - name: Upload build artifact (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/PulsarLab/**
            dist/installer/**
          if-no-files-found: error

      - name: Upload build artifact (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/PulsarLab/**
          if-no-files-found: error

      - name: Upload build artifact (macOS)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/PulsarLab.app/**
          if-no-files-found: error

  # ----------------------------------------------------
  # Solo en tags "v*": arma un GitHub Release con los tres
  # artefactos y un ZIP de código fuente con carpeta "PulsarLab"
  # (en lugar de "PulsarLab-main", que es lo que genera el botón
  # "Code -> Download ZIP" de GitHub y no se puede renombrar).
  # ----------------------------------------------------
  release:
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          # Windows: el instalador ya tiene nombre final; el resto se
          # empaqueta como ZIP portable.
          cp release-artifacts/PulsarLab-Windows/installer/*.exe release-assets/
          (cd release-artifacts/PulsarLab-Windows && zip -r -X \
            "../../release-assets/PulsarLab-${APP_VERSION}-Windows-x64.zip" PulsarLab)

          # Linux
          (cd release-artifacts/PulsarLab-Linux && zip -r -X \
            "../../release-assets/PulsarLab-${APP_VERSION}-Linux-x64.zip" .)

          # macOS
          (cd release-artifacts/PulsarLab-macOS && zip -r -X -y \
            "../../release-assets/PulsarLab-${APP_VERSION}-macOS.zip" .)

          # ZIP de código fuente con el nombre de carpeta correcto
          # ("PulsarLab", no "PulsarLab-main").
          git archive --format=zip --prefix=PulsarLab/ \
            -o "release-assets/PulsarLab-${APP_VERSION}-Source.zip" HEAD

          ls -la release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PulsarLab ${{ env.APP_VERSION }}
          generate_release_notes: true
          files: release-assets/*